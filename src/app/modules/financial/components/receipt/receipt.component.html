<div class="col-span-2">
  <div class="flex flex-col gap-2 py-2">
    <!-- Iterate through checkBookList -->
    <ul class="rounded-md border border-border">
      <ng-container *ngTemplateOutlet="listItem; context: { label: cur, value: receipt.currencyUnit }"> </ng-container>
      <ng-container
        *ngTemplateOutlet="listItem; context: { label: amount, value: receipt.amount | currency: '':'':'1.0-0' }">
      </ng-container>
      <ng-container
        *ngTemplateOutlet="listItem; context: { label: discount, value: receipt.discount | currency: '':'':'1.0-0' }">
      </ng-container>
      <ng-container *ngTemplateOutlet="listItem; context: { label: percent, value: '%' + receipt.discountPercent }">
      </ng-container>
      <ng-container
        *ngTemplateOutlet="listItem; context: { label: total, value: receipt.totalAmount | currency: '':'':'1.0-0' }">
      </ng-container>
    </ul>
  </div>
</div>

<ng-template #listItem let-label="label" let-value="value">
  <li class="my-1 flex justify-between p-3">
    <section class="font-light text-muted-foreground">{{ label }}:</section>
    <section style="direction: ltr" class="font-bold text-muted-foreground">{{ value }}</section>
  </li>
</ng-template>
