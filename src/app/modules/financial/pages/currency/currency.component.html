<div class="flex w-full flex-col gap-10">
  <app-header-buttons (primaryClick)="navAdd()" (lightClick)="backToDash()"></app-header-buttons>

  @if(tableConfig){

  <app-table1
    [tableConfig]="tableConfig"
    [list]="(pg.normalizedData$ | async)!"
    [pagination]="(pg.pagination$ | async)!"
    (onPage)="pg.onPageChange($event)"></app-table1>
  }
</div>

<ng-template
  #coefficientRegistration
  let-onEachBaseCoefficientChange="onEachBaseCoefficientChange"
  let-baseCoefficient="baseCoefficient"
  let-index="index">
  <input
    (input)="onEachBaseCoefficientChange($event, index)"
    type="text"
    class="w-10 rounded-md border border-border"
    [value]="baseCoefficient" />
</ng-template>

<ng-template #activeTemplate let-selected="selected" let-index="index" let-statusChange="statusChange">
  <app-switch (onChangeStatus)="statusChange($event)" [selected]="selected" [name]="index"></app-switch>
</ng-template>
