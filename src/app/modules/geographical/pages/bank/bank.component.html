<div class="w-full">
  <app-header-buttons (primaryClick)="navAdd()" (lightClick)="navDash()"></app-header-buttons>

  @if (tableConfig) {

  <div class="mt-10 w-full">
    <app-table1
      [list]="(pg.normalizedData$ | async)!"
      [tableConfig]="tableConfig"
      [pagination]="(pg.pagination$ | async)!"></app-table1>
  </div>
  }

  <ng-template #activeTem let-index="index" let-onStatusChange="onStatusChange" let-selected="selected">
    <app-switch [name]="index" [selected]="selected" (onChangeStatus)="onStatusChange($event, index)"></app-switch>
  </ng-template>
</div>
