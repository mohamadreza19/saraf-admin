@if (tableConfig && statusTem) {
<app-header-buttons (primaryClick)="navAdd()" (lightClick)="navDash()"></app-header-buttons>
<div class="mt-10 w-full">
  <app-table1
    [tableConfig]="tableConfig"
    [list]="(pg.normalizedData$ | async)!"
    [pagination]="(pg.pagination$ | async)!"
    (onPage)="pg.onPageChange($event)"></app-table1>
</div>
}

<ng-template #statusTem let-index="index" let-selected="selected" let-onStatusChange="onStatusChange">
  <app-switch [selected]="selected" [name]="index" (onChangeStatus)="onStatusChange($event)"></app-switch>
</ng-template>
