@if (tableConfig && activeButton) {
<app-header-buttons (primaryClick)="navAdd()" (lightClick)="navDash()"></app-header-buttons>
<div class="mt-10 w-full">
  <app-table1
    [tableConfig]="tableConfig"
    [list]="(paginationService.normalizedData$ | async)!"
    [pagination]="(paginationService.pagination$ | async)!"
    (onPage)="paginationService.onPageChange($event)"></app-table1>
</div>
}

<ng-template #activeButton>
  <input type="checkbox" checked />
</ng-template>
