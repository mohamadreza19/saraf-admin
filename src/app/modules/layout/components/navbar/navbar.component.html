<div class="relative bg-background">
  <div class="mx-auto px-5">
    <div class="flex items-center py-3.5 md:justify-start">
      <!-- Mobile Navigation Menu Button-->
      <div class="sm:order-1 md:hidden">
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="inline-flex items-center justify-center rounded-md bg-muted p-2 text-muted-foreground hover:bg-muted-foreground hover:text-muted focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary"
          aria-expanded="false">
          <span i18n class="sr-only">Open menu</span>
          <!-- Heroicon name: outline/menu -->
          <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-6 w-6'"> </svg-icon>
        </button>
      </div>

      <!-- Logo -->
      <div class="flex items-center justify-start sm:order-2 md:mr-10 lg:hidden">
        <a class="flex items-center justify-center rounded bg-primary p-2 focus:outline-none focus:ring-1">
          <svg-icon src="assets/icons/logo.svg"></svg-icon>
        </a>
        <b i18n class="hidden pl-3 text-sm font-bold text-foreground sm:block"> پیمان </b>
      </div>

      <!-- Desktop Menu -->

      <div class="hidden flex-col space-x-10 sm:order-3 md:flex">
        <p i18n class="text-title-md font-normal">
           سامانه خرید و فروش ارز ، طلا و نقره
          <br />
        </p>
        <span i18n class="bg-clip-text text-headline-lg font-bold text-primary">پیمان</span>
        <div></div>

        <!-- <app-navbar-menu></app-navbar-menu> -->
      </div>
      <!-- Title -->

      <!-- Profile menu -->
      <div class="items-center justify-end gap-x-2 sm:order-4 md:flex md:flex-1 lg:w-0">
        <app-base-currency></app-base-currency>
        <app-navbar-notification/>
        <app-navbar-date-status></app-navbar-date-status>
        <app-profile-menu></app-profile-menu>


      </div>
    </div>
  </div>
  <!-- Mobile menu -->
  <app-navbar-mobile></app-navbar-mobile>
</div>
