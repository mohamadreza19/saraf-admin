<div class="container relative mx-auto p-6">
  <h1 class="mb-6 text-right text-3xl font-extrabold text-gray-800">لیست ماژول‌ها</h1>

  <p class="absolute -end-5 -rotate-[60deg] text-red-700">رسید از بک اند جنریت میشود</p>
  <!-- List of Modules -->
  <!-- module-control.component.html -->

  <div class="container mx-auto p-4">
    <table class="min-w-full rounded-lg border border-gray-200 bg-white shadow-md">
      <thead>
        <tr class="bg-gray-100 text-center text-gray-600">
          <th class="px-6 py-3">نام</th>
          <!-- Name -->
          <th class="px-6 py-3">دوره</th>
          <!-- Period -->
          <th class="px-6 py-3">مقدار</th>
          <!-- Amount -->
          <th class="px-6 py-3">واحد ارزی</th>
          <!-- Currency Unit -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of testData" class="border-b border-gray-200 hover:bg-gray-50">
          <td class="px-6 py-4">{{ item.name }}</td>
          <td class="px-6 py-4">{{ item.period }}</td>
          <td class="px-6 py-4">{{ item.amount }}</td>
          <td class="px-6 py-4">{{ item.currencyUnit }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Total Amount -->
  <div class="mt-8 text-right">
    <div class="inline-block rounded-lg bg-gray-100 p-4">
      <h2 class="text-xl font-bold text-gray-800">
        مجموع :
        <span>{{ getTotalAmount(testData) }}</span>
        <!-- {{ data[0]?.currencyUnit }} -->
      </h2>
    </div>
  </div>
</div>
