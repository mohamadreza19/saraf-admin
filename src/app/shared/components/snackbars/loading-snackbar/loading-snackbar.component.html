<div class="flex items-center justify-between">
  <p>{{ data.text }}</p>

  @switch (data.status) { @case ('loading') {
  <mat-spinner strokeWidth="20" class="max-h-[16px] max-w-[16px]"></mat-spinner>
  } @case ('success') {
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="max-h-[16px] max-w-[16px] fill-green-500">
    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19L21 7l-1.41-1.41z"></path>
  </svg>
  } @case ('error') {
  <span class="font-bold text-red-500">x</span>
  }}
</div>
